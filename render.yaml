services:
  - type: web
    name: phundable
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server/server.py
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
